ievents {}

http {

    server {
        listen 80;
        server_name site1.local;

        root /var/www/site1;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }

    server {
        listen 80;
        server_name site2.local;

        root /var/www/site2;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }

}
